# Minimal docker-compose for local development
# Use this to run only MongoDB while running API/Bot locally
version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: himo-mongodb-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-local:/data/db
    environment:
      MONGO_INITDB_DATABASE: himo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MongoDB web interface
  mongo-express:
    image: mongo-express:latest
    container_name: himo-mongo-express-local
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo

volumes:
  mongo-data-local:
