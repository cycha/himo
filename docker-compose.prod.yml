# Production Docker Compose Configuration
# Updated for Vite + npm + modern setup
version: "3.8"

services:
  # Frontend - React App with Nginx
  client:
    image: himo-client:latest
    container_name: himo-client
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend - Node.js API
  api:
    image: himo-api:latest
    container_name: himo-api
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/himo
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped
    command: npm run start

  # Bot - Web Scraper
  bot:
    image: himo-bot:latest
    container_name: himo-bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/himo
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  # Database - MongoDB
  mongo:
    image: mongo:6-alpine
    container_name: himo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local