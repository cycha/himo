services:
  api:
    image: ghcr.io/cycha/himo-api:latest
    pull_policy: always
    container_name: himo-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BOT_URL: http://bot:3002
    restart: unless-stopped
    networks:
      - himo-network
    volumes:
      - ./api/.env.production:/app/.env

  client:
    image: ghcr.io/cycha/himo-client:latest
    pull_policy: always
    container_name: himo-client
    ports:
      - "80:80"
      - "443:443"
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - himo-network
    depends_on:
      - api
    volumes:
      - /etc/letsencrypt/live/himo.myddns.me:/etc/letsencrypt/live/himo.myddns.me:ro
      - /etc/letsencrypt/archive/himo.myddns.me:/etc/letsencrypt/archive/himo.myddns.me:ro

  tor:
    image: dperson/torproxy
    container_name: himo-tor
    restart: unless-stopped
    networks:
      - himo-network
    environment:
      TOR_ControlPort: "9051"

  bot:
    image: ghcr.io/cycha/himo-bot:latest
    pull_policy: always
    container_name: himo-bot
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOR_PROXY: socks5://tor:9050
      TOR_CONTROL: tor:9051
    restart: unless-stopped
    networks:
      - himo-network
    depends_on:
      - api
      - tor

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: himo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - himo-network

volumes:
  postgres_data:

networks:
  himo-network:
    driver: bridge
