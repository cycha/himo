services:
  api:
    image: ghcr.io/cycha/himo-api:latest
    container_name: himo-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BOT_URL: http://bot:3002
    restart: unless-stopped
    networks:
      - himo-network
    mem_limit: 256m
    volumes:
      - ./api/.env.production:/app/.env

  client:
    image: ghcr.io/cycha/himo-client:latest
    container_name: himo-client
    ports:
      - "80:80"
      - "443:443"
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - himo-network
    depends_on:
      - api
    volumes:
      - /etc/letsencrypt/live/himoapp.duckdns.org:/etc/letsencrypt/live/himoapp.duckdns.org:ro
      - /etc/letsencrypt/archive/himoapp.duckdns.org:/etc/letsencrypt/archive/himoapp.duckdns.org:ro
    mem_limit: 128m

  bot:
    image: ghcr.io/cycha/himo-bot:latest
    container_name: himo-bot
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CRAWLEE_MEMORY_MBYTES: 400
      CRAWLEE_AVAILABLE_MEMORY_RATIO: "0.9"
    restart: unless-stopped
    networks:
      - himo-network
    mem_limit: 512m
    shm_size: 256m
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: himo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    shm_size: 256m
    restart: unless-stopped
    networks:
      - himo-network

volumes:
  postgres_data:

networks:
  himo-network:
    driver: bridge
