services:
  api:
    image: ghcr.io/cycha/himo-api:latest
    container_name: himo-api
    entrypoint: ["/bin/sh", "/app/api/docker-entrypoint.prod.sh"]
    # Loopback only: the edge Caddy (host network) is the sole public entry.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN}
      BOT_URL: http://bot:3002
    restart: unless-stopped
    networks:
      - himo-network
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

  client:
    image: ghcr.io/cycha/himo-client:latest
    container_name: himo-client
    # One-shot: copies the built SPA into /srv/himo-client, served by the
    # shared edge Caddy (/opt/edge on the VPS), then exits.
    restart: "no"
    network_mode: none
    volumes:
      - /srv/himo-client:/out
    mem_limit: 32m

  bot:
    image: ghcr.io/cycha/himo-bot:latest
    container_name: himo-bot
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CRAWLEE_MEMORY_MBYTES: 400
      CRAWLEE_AVAILABLE_MEMORY_RATIO: "0.9"
    restart: unless-stopped
    networks:
      - himo-network
    mem_limit: 512m
    shm_size: 128m
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: himo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    shm_size: 256m
    restart: unless-stopped
    networks:
      - himo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run/postgresql:size=16m

volumes:
  postgres_data:

networks:
  himo-network:
    driver: bridge
