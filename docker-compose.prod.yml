services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    container_name: himo-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    networks:
      - himo-network
    volumes:
      - ./api/.env.production:/app/.env

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
    container_name: himo-client
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - himo-network
    depends_on:
      - api

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile.prod
    container_name: himo-bot
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    networks:
      - himo-network
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: himo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - himo-network

volumes:
  postgres_data:

networks:
  himo-network:
    driver: bridge
