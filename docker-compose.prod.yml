# Prod conf file
version: "3.7"
services:

  client:
    image: himo-client
    container_name: himo-react-client
    links:
      - api
    networks:
      - app-network
    build:
      context: client
      dockerfile: Dockerfile.prod
    volumes:
      - /client/node_modules
    ports:
      - 80:80

  api:
    build:
      dockerfile: api/Dockerfile.prod
    volumes:
    - /api/client/node_modules
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo/db
      API_PORT: 3000
    ports:
      - 3000
    restart: unless-stopped
    command: npm run start

  bot:
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo/db
#      INSTANCE_SCALING_MIN: 0
#    ports:
#      - 8889:8889
    restart: unless-stopped
    command: npm run start

  mongo:
    image: mongo
    expose:
      - 27017
    ports:
      - 27017:27017
    volumes:
      - data-volume:/data/db
    restart: unless-stopped
    networks:
      - app-network

volumes:
  data-volume:
  node_modules:
#      environment:
#        MONGO_INITDB_ROOT_USERNAME: root
#        MONGO_INITDB_ROOT_PASSWORD: example