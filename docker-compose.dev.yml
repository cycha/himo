# Development docker-compose override
version: "3.8"

services:
  api:
    build:
      dockerfile: api/Dockerfile.dev
    volumes:
      - ./api:/app/api
      - ./commons:/app/commons
      - /app/api/node_modules
      - /app/commons/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URL: mongodb://mongo:27017/himo
    command: npm run dev --workspace=api
    ports:
      - "3000:3000"
      - "9229:9229"  # Node debugger port

  bot:
    build:
      dockerfile: bot/Dockerfile.dev
    volumes:
      - ./bot:/app/bot
      - ./commons:/app/commons
      - /app/bot/node_modules
      - /app/commons/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URL: mongodb://mongo:27017/himo
    command: npm run dev --workspace=bot

  # Development MongoDB with web interface
  mongo-express:
    image: mongo-express:latest
    container_name: himo-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    networks:
      - himo-network
