name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Deploy to VPS via SCP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/deploy/himo"
          rm: true

      - name: Build and start containers on VPS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment to VPS..."

            cd /home/deploy/himo

            # Create .env file if it doesn't exist
            if [ ! -f .env ]; then
              echo "Creating .env file from example..."
              cp .env.example .env
              echo "⚠️  WARNING: Please update .env with your production values"
              echo "Edit: nano /home/deploy/himo/.env"
            fi

            # Build and start containers
            echo "Building and starting Docker containers..."
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d

            # Run database migrations (if needed)
            echo "Running database migrations..."
            docker-compose -f docker-compose.prod.yml exec -T api pnpm run prisma:migrate || true

            echo "✅ Deployment completed successfully!"
            docker-compose -f docker-compose.prod.yml ps

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Deployment completed with status: ${{ needs.deploy.result }}"
          # Configure your notification method here:
          # - Slack webhook
          # - Discord webhook
          # - Email
          # - etc.
