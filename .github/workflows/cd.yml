name: CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build and push Docker images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/himo-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/himo-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./bot/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/himo-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,.env.example"
          target: "/home/deploy/himo"

      - name: Pull images and start containers on VPS
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment to VPS..."

            cd /home/deploy/himo

            # Create .env file if it doesn't exist
            if [ ! -f .env ]; then
              echo "Creating .env file from example..."
              cp .env.example .env
              echo "⚠️  WARNING: Please update .env with your production values"
              echo "Edit: nano /home/deploy/himo/.env"
            fi

            # Log in to GHCR
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ env.OWNER }} --password-stdin

            # Stop containers and clean up old images to free disk space
            echo "Stopping containers and cleaning up old images..."
            docker compose -f docker-compose.prod.yml down || true
            docker image prune -af
            docker builder prune -af || true

            # Pull latest images
            echo "Pulling latest images from GHCR..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting Docker containers..."
            docker compose -f docker-compose.prod.yml up -d

            # Run database migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy || true

            echo "✅ Deployment completed successfully!"
            docker compose -f docker-compose.prod.yml ps

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Deployment completed with status: ${{ needs.deploy.result }}"
          # Configure your notification method here:
          # - Slack webhook
          # - Discord webhook
          # - Email
          # - etc.
