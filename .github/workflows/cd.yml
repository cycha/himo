name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_REGISTRY }}/himo
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/himo-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/himo-client:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bot Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          file: ./bot/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/himo-bot:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        if: github.event_name != 'pull_request'
        run: |
          echo "Deployment step - configure based on your infrastructure"
          echo "Examples:"
          echo "  - SSH to server and run docker-compose pull && docker-compose up -d"
          echo "  - Use kubectl to deploy to Kubernetes"
          echo "  - Trigger deployment via API"
          echo "  - Deploy to cloud provider (AWS, GCP, Azure, etc.)"
        # Uncomment and configure based on your deployment method:
        #
        # SSH Deployment Example:
        # - name: Deploy via SSH
        #   uses: appleboy/ssh-action@v1.0.0
        #   with:
        #     host: ${{ secrets.SSH_HOST }}
        #     username: ${{ secrets.SSH_USERNAME }}
        #     key: ${{ secrets.SSH_PRIVATE_KEY }}
        #     script: |
        #       cd /path/to/app
        #       docker-compose pull
        #       docker-compose up -d
        #
        # Kubernetes Deployment Example:
        # - name: Deploy to Kubernetes
        #   uses: azure/k8s-deploy@v4
        #   with:
        #     manifests: |
        #       k8s/deployment.yml
        #     images: |
        #       ${{ secrets.DOCKER_REGISTRY }}/himo-api:${{ steps.meta.outputs.version }}
        #     kubectl-version: 'latest'

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Deployment completed with status: ${{ needs.deploy.result }}"
          # Configure your notification method here:
          # - Slack webhook
          # - Discord webhook
          # - Email
          # - etc.
