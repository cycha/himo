name: Code Quality

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

  eslint:
    name: ESLint Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Run TypeScript type check
        run: pnpm type-check

  duplicate-code:
    name: Copy-Paste Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Detect duplicate code
        run: |
          jscpd . --min-lines 10 --min-tokens 50 \
            --format "typescript,javascript" \
            --ignore "**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/dist/**,**/build/**" \
            --reporters "console" \
            --threshold 5 || echo "Duplicates found but continuing..."

  circular-dependencies:
    name: Circular Dependency Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install madge
        run: npm install -g madge

      - name: Check for circular dependencies in API
        run: |
          echo "Checking API for circular dependencies..."
          madge --circular --extensions ts api/src || echo "Circular dependencies found in API"

      - name: Check for circular dependencies in Client
        run: |
          echo "Checking Client for circular dependencies..."
          madge --circular --extensions ts,tsx client/src || echo "Circular dependencies found in Client"

      - name: Check for circular dependencies in Bot
        run: |
          echo "Checking Bot for circular dependencies..."
          madge --circular --extensions ts bot/src || echo "Circular dependencies found in Bot"

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Build client
        run: pnpm --filter client build

      - name: Check bundle size
        run: |
          if [ -d "client/build" ]; then
            echo "Client bundle sizes:"
            du -sh client/build/*
            total_size=$(du -sk client/build | cut -f1)
            echo "Total bundle size: ${total_size}KB"
            # Add size limit check if needed
            # if [ "$total_size" -gt 5000 ]; then
            #   echo "Bundle size exceeds 5MB limit!"
            #   exit 1
            # fi
          fi
