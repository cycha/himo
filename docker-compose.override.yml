# Development overrides - PostgreSQL version
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./api/src:/app/src
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/himo?schema=public
    ports:
      - "3000:3000"
    command: sh -c "npx prisma generate && npm run dev"

  bot:
    volumes:
      - ./bot/src:/app/src
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/himo?schema=public
      DISPLAY: :99
      HEADLESS: "false"
    # Expose debug port
    ports:
      - "8889:8889"