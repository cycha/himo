# Base docker-compose configuration
version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: himo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: himo
    networks:
      - himo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: himo-api
    container_name: himo-api
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/himo
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - himo-network
    restart: unless-stopped

  bot:
    image: himo-bot
    container_name: himo-bot
    build:
      context: .
      dockerfile: bot/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/himo
      SCRAPING_INTERVAL: ${SCRAPING_INTERVAL:-*/2 5-22 * * *}
    networks:
      - himo-network
    restart: unless-stopped

networks:
  himo-network:
    driver: bridge

volumes:
  mongo-data: