# Dev conf file no production
version: "3"
services:
  client:
    image: node:alpine
    volumes:
      - ./client/:/client
      - /client/node_modules
    environment:
      NODE_ENV: development
    working_dir: /client
    ports:
      - 80:3000
    command: yarn start #yarn install
    links:
      - api
    networks:
      - app-network
  api:
    image: node:alpine
    volumes:
      - ./api:/api
      - /api/node_modules
    working_dir: /api
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
    ports:
      - 3
      - 9000:9000
    command: npm run dev #npm install
    networks:
      - app-network

  mongo:
    image: mongo
    expose:
      - 27017
    ports:
      - 27017:27017
    volumes:
      - ./data/db:/data/db
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

