# Base docker-compose configuration - PostgreSQL + PostGIS
version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: himo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: himo
    networks:
      - himo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d himo -c \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: himo-api
    container_name: himo-api
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/himo?schema=public
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - himo-network
    restart: unless-stopped

  tor:
    image: dperson/torproxy
    container_name: himo-tor
    restart: unless-stopped
    ports:
      - "9050:9050"  # SOCKS5 proxy
      - "9051:9051"  # Control port for IP rotation
    networks:
      - himo-network
    volumes:
      - ./torrc:/etc/tor/torrc:ro

  bot:
    image: himo-bot
    container_name: himo-bot
    platform: linux/amd64
    build:
      context: .
      dockerfile: bot/Dockerfile
      platforms:
        - linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/himo?schema=public
      SCRAPING_INTERVAL: ${SCRAPING_INTERVAL:-0 0 */6 * * *}  # Every 6 hours to avoid DataDome
      TOR_PROXY: socks5://tor:9050
      TOR_CONTROL: tor:9051
      DISPLAY: :99
      HEADLESS: "false"
    networks:
      - himo-network
    restart: unless-stopped
    # Increase memory for Xvfb + Chromium
    mem_limit: 512m
    shm_size: 256m

networks:
  himo-network:
    driver: bridge

volumes:
  postgres-data: