# Base docker-compose configuration - PostgreSQL + PostGIS
version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: himo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: himo
    networks:
      - himo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: himo-api
    container_name: himo-api
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/himo?schema=public
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - himo-network
    restart: unless-stopped

  bot:
    image: himo-bot
    container_name: himo-bot
    build:
      context: .
      dockerfile: bot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/himo?schema=public
      SCRAPING_INTERVAL: ${SCRAPING_INTERVAL:-*/2 5-22 * * *}
    networks:
      - himo-network
    restart: unless-stopped

networks:
  himo-network:
    driver: bridge

volumes:
  postgres-data: