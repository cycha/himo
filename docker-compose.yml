version: "3"
services:
  app:
    image: node:alpine
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
    ports:
      - 80:3000
    command: npm run dev
#    networks:
#      - app-network

  mongo:
    image: mongo
    expose:
      - 27017
    ports:
      - 27017:27017
    volumes:
      - ./data/db:/data/db
    restart: always
#    networks:
#      - app-network

